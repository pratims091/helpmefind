<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>helpmefind - AI-Powered Review Analysis</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'%3E%3Cpath d='M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z'/%3E%3C/svg%3E">
  <link rel="icon" type="image/png" sizes="32x32" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/icons/Map/map-pin-fill.png">
  <link rel="apple-touch-icon" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/icons/Map/map-pin-fill.png">

  <!-- Remix Icon for modern icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.min.css" rel="stylesheet">

  <!-- Force early dark mode detection to prevent flash -->
  <script src="./static/scripts/header.js"></script>

  <link rel="stylesheet" href="./static/styles/main.css">
</head>
<body>
  <div class="container">
    <!-- Landing Page -->
    <div id="landing" class="text-center py-16">
      <div class="logo-container">
        <i class="ri-map-pin-line"></i>
      </div>
      <h1 class="main-heading">Place Finder</h1>
      <p class="subtitle">Discover the perfect spots near you with AI-powered review analysis</p>
      <p class="description">We analyze thousands of reviews so you don't have to. Get real insights in seconds.</p>
      <button id="start-btn" class="btn btn-primary btn-pulse">
        <i class="ri-search-line"></i>
        <span>Find Places Near Me</span>
      </button>
    </div>

    <!-- Search Container -->
    <div id="search" class="search-container text-center hidden">
      <h2>What are you looking for?</h2>
      <div class="search-box">
        <input type="text" id="search-input" class="search-input" placeholder="Coffee shop, restaurant, gym...">
        <button id="find-btn" class="search-button">
          <i class="ri-compass-3-line"></i>
          <span>Help me find</span>
        </button>
      </div>

      <!-- CAPTCHA container -->
      <div id="captcha-container" class="mt-4 hidden">
        <div class="status-container">
          <div class="status-icon">
            <i class="ri-shield-check-line icon-blue"></i>
          </div>
          <p class="status-text">Please complete the CAPTCHA to continue</p>
        </div>

        <div id="captcha-challenge" class="p-4 mt-4 bg-secondary rounded shadow">
          <!-- CAPTCHA content will be inserted here -->
        </div>

        <button id="verify-captcha" class="btn btn-primary mt-4">
          <i class="ri-check-line"></i>
          <span>Verify</span>
        </button>
      </div>
    </div>

    <!-- Status Message -->
    <div id="status" class="flex justify-center hidden">
      <div class="status-container">
        <div id="status-icon" class="status-icon"></div>
        <p id="status-text" class="status-text"></p>
      </div>
    </div>

    <!-- Results Container -->
    <div id="results" class="results-section hidden"></div>

    <footer class="py-6 mt-8">
      <div class="text-center">
        <p class="mb-3">Made with <i class="ri-heart-fill icon-red"></i> and <i class="ri-ai-generate icon-blue"></i> by <a href="https://pratim.me" target="_blank" rel="noopener noreferrer">Pratim Sarangi</a></p>
        <div class="social-links">
          <a href="https://github.com/pratims091" target="_blank" rel="noopener noreferrer" title="GitHub">
            <i class="ri-github-fill"></i>
          </a>
          <a href="https://www.linkedin.com/in/pratim-sarangi/" target="_blank" rel="noopener noreferrer" title="LinkedIn">
            <i class="ri-linkedin-box-fill"></i>
          </a>
          <a href="https://x.com/PratimSarangi1" target="_blank" rel="noopener noreferrer" title="Twitter/X">
            <i class="ri-twitter-x-fill"></i>
          </a>
        </div>
      </div>
    </footer>
  </div>

  <!-- Image Modal -->
  <div id="image-modal" class="modal">
    <div class="modal-close">
      <i class="ri-close-line"></i>
    </div>
    <div class="modal-nav modal-prev">
      <i class="ri-arrow-left-s-line"></i>
    </div>
    <img id="modal-img" class="modal-img" alt="Modal">
    <div class="modal-nav modal-next">
      <i class="ri-arrow-right-s-line"></i>
    </div>
    <div class="modal-counter">1 / 5</div>
  </div>
  <script src="./static/scripts/footer.js"></script>
</body>
</html>
