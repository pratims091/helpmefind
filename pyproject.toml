[tool.ruff]
# Enable everything
lint.select = ["E", "F", "I"]  # Errors, style violations, and import sorting
line-length = 100
target-version = "py312"
fix = true

# Ignore specific rules (optional)
lint.ignore = []

# Auto-fix imports
[tool.ruff.lint.isort]
known-first-party = ["agents", "chains", "tools"]  # Your package names
